<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Blue rounded background -->
  <rect width="100" height="100" rx="22" fill="#1565C0"/>

  <!-- Left ear -->
  <ellipse cx="28" cy="36" rx="12" ry="20" fill="#F9D823" transform="rotate(-18 28 36)"/>
  <!-- Right ear -->
  <ellipse cx="72" cy="36" rx="12" ry="20" fill="#F9D823" transform="rotate(18 72 36)"/>

  <!-- Head -->
  <circle cx="50" cy="58" r="26" fill="#F9D823"/>

  <!-- Snout -->
  <ellipse cx="50" cy="67" rx="13" ry="10" fill="#E8C018"/>

  <!-- Eyes -->
  <circle cx="41" cy="52" r="4" fill="#1a1a1a"/>
  <circle cx="59" cy="52" r="4" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="42.5" cy="50.5" r="1.4" fill="#fff"/>
  <circle cx="60.5" cy="50.5" r="1.4" fill="#fff"/>

  <!-- Nose -->
  <ellipse cx="50" cy="63" rx="4.5" ry="3.5" fill="#1a1a1a"/>

  <!-- Smile -->
  <path d="M 43 69 Q 50 74 57 69" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
